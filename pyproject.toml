[project]
name = "tablesense"
version = "0.1.0"
description = "Real-time computer vision for restaurant floors: table states, service alerts and queues."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deep learning: PyTorch and YOLO
dl = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "matplotlib>=3.9",
]
# Tracking: Hungarian assignment
track = [
    "scipy>=1.14",
]
# Deployment: ONNX / CoreML export and the API server
deploy = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "coremltools>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# JAX: vectorized Kalman filter
jax = [
    "jax>=0.4.35",
    "flax>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tablesense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
